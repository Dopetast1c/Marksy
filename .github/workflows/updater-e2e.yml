name: Updater end to end

# The updater against real Docker (scripts/updater-e2e.mjs): this commit's three images, releases built from them in a
# registry on the runner, signed with a key made for the run. Channels, the hook, polling, quiet hours, the collector,
# rollbacks of a broken release and of a failing migration, refused signatures and the self-update. Nothing leaves
# the runner; no secret is needed. It takes about twenty minutes, so it runs when the updater, the images or the
# compose file change, and by hand.

on:
  push:
    paths:
      - 'updater/**'
      - 'server/**'
      - 'docker/**'
      - 'web/Dockerfile'
      - 'docker-compose.prod.yml'
      - 'scripts/updater-e2e.mjs'
      - 'scripts/e2e/**'
      - '.github/workflows/updater-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3
        with:
          # the images must land in the local Docker for the releases built FROM them
          driver: docker

      # the version the updater image verifies with (updater/Dockerfile)
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build this commit's images
        run: |
          for image in server web updater; do
            docker build -q -f "$image/Dockerfile" -t "marksy-$image:e2e" --build-arg MARKSY_VERSION=0.0.0 .
          done

      - name: Run
        run: node scripts/updater-e2e.mjs
