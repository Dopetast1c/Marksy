# The updater's end-to-end test (scripts/updater-e2e.mjs, CI only), over docker-compose.prod.yml: the images come from
# a registry on localhost signed with a test key, volumes and the network have names of their own so that nothing
# meets a real installation, and the updater polls every minute (E2E_POLL_MINUTES) with a short health timeout.

x-image: &prefix
  UPDATE_IMAGE_PREFIX: localhost:5000/marksy-

services:
  registry:
    image: registry:2.8.3
    ports:
      - '5000:5000'
    networks: [edge]

  server:
    image: localhost:5000/marksy-server:${UPDATE_CHANNEL}
    pull_policy: always
  backup:
    image: localhost:5000/marksy-server:${UPDATE_CHANNEL}
    pull_policy: always
  web:
    image: localhost:5000/marksy-web:${UPDATE_CHANNEL}
    pull_policy: always
  proxy:
    image: localhost:5000/marksy-web:${UPDATE_CHANNEL}
    pull_policy: always
  updater:
    image: localhost:5000/marksy-updater:${UPDATE_CHANNEL}
    pull_policy: always
    environment:
      <<: *prefix
      UPDATE_TEST_COSIGN_KEY: /keys/cosign.pub
      UPDATE_TEST_REGISTRY_FORWARD: registry:5000
      UPDATE_POLL_MINUTES: ${E2E_POLL_MINUTES:-1}
      UPDATE_HEALTH_TIMEOUT_SECONDS: '90'
    volumes:
      - ./keys:/keys:ro
  socket-guard:
    image: localhost:5000/marksy-updater:${UPDATE_CHANNEL}
    pull_policy: always
    environment:
      <<: *prefix

volumes:
  pgdata:
    name: marksy-e2e-pgdata
  uploads:
    name: marksy-e2e-uploads
  updater-state:
    name: marksy-e2e-updater-state
